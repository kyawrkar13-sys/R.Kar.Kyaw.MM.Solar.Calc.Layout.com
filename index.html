<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">    
    
<title>PV Layout Calculator</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">     
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="style.css">
</head>

<body>
<!-- ☀️ Solar Rough Calculation -->
<div class="card">

    <div class="header">
        <img src="logo.png">
        <h2>☀️ Solar Rough Calculation</h2>
    </div>

    <label>Total Load (kW)</label>
    <input
        type="number"
        id="totalLoad"
        placeholder="Enter total load"
        step="0.01"
    >

    <label>Solar Panel Watt</label>
    <select id="solarWatt">
        <option value="615">615 W</option>
        <option value="650" selected>650 W</option>
        <option value="700">700 W</option>
        <option value="720">720 W</option>
        <option value="750">750 W</option>
    </select>

    <label>Efficiency</label>
    <select id="solarEfficiency">
        <option value="0.80" selected>80%</option>
        <option value="0.70">70%</option>
    </select>

    <button onclick="solarRoughCalculate()">
        ☀️ Calculate
    </button>

    <div id="solarOutput" class="result">
        Solar result will show here
    </div>

</div>


<!-- 📐 PV Layout Calculator -->
<div class="card">

    <div class="header">
        <img src="logo.png">
        <h2>🧮 Rkar Kyaw's Solar Calculation</h2>
</div>
    <label>Site Length (m)</label>
<input type="number" id="length" placeholder=" ">

<label>Site Width (m)</label>
<input type="number" id="width" placeholder=" ">

<label>Setback Distance (m)</label>
<input type="number" id="setback" value=" ">

<label>Panel Watt</label>
<select id="watt">
    <option value="615">615 W</option>
    <option value="650" selected>650 W</option>
    <option value="700">700 W</option>
    <option value="720">720 W</option>
    <option value="750">750 W</option>
</select>

<label>Panel Length (m)</label>
<input type="number" id="pl" value="2.4">

<label>Panel Width (m)</label>
<input type="number" id="pw" value="1.3">

<label>Row Spacing (m)</label>
<input type="number" id="row" value=" ">

<label>Column Spacing (m)</label>
<input type="number" id="column" value=" ">

<button onclick="calculate()">Calculate</button>

<hr>

<h2>📐 PV Layout Design</h2>


</div>

<div id="layout">

<div class="north">

</div>

<div id="site"></div>

<div class="road">

</div>

</div>

<div id="output" class="result">
Result will show here
</div>

</div>
