<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PV Layout Design</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="card">
<div class="header">

<img src="logo.png">

<h2>📐 PV Layout Design</h2>


<label>Site Length (m)</label>
<input id="dLength" type="number" value=" ">


<label>Site Width (m)</label>
<input id="dWidth" type="number" value=" ">


<label>Setback Distance (m)</label>
<input id="dSetback" type="number" value=" ">


<label>Panel Length (m)</label>
<input id="dPL" type="number" value="2.4">


<label>Panel Width (m)</label>
<input id="dPW" type="number" value="1.3">


<button onclick="generateLayout()">
Generate Layout
</button>


<div class="result" id="dResult">
Layout Result
</div>



<div id="drawing">


<div class="north">
↑ NORTH
</div>


<div id="pvSite"></div>


<div class="road">
ROAD / ACCESS
</div>


</div>


</div>



<div class="menu">


<a href="index.html">
<div>
☀️
<br>
Home
</div>
</a>


<a href="design.html">
<div>
📐
<br>
Design
</div>
</a>


<a href="battery.html">
<div>
🔋
<br>
Battery
</div>
</a>


<a href="setting.html">
<div>
⚙️
<br>
Setting
</div>
</a>


</div>




<script>


function generateLayout(){


let L =
Number(document.getElementById("dLength").value);


let W =
Number(document.getElementById("dWidth").value);


let SB =
Number(document.getElementById("dSetback").value);


let PL =
Number(document.getElementById("dPL").value);


let PW =
Number(document.getElementById("dPW").value);



let usableL =
L-(SB*2);


let usableW =
W-(SB*2);


let column =
Math.floor(usableL/PW);


let row =
Math.floor(usableW/PL);



let qty =
column*row;



let site =
document.getElementById("pvSite");


site.innerHTML="";


site.style.display="grid";

site.style.gridTemplateColumns=
`repeat(${column},1fr)`;



for(let i=0;i<qty;i++){


let panel =
document.createElement("div");


panel.className="panel";


panel.innerHTML="PV";


site.appendChild(panel);


}




document.getElementById("dResult").innerHTML = `


<b>📐 Layout Result</b>

<br><br>


Usable Area :

${usableL.toFixed(1)}m × ${usableW.toFixed(1)}m


<br><br>


Row :

${row}


<br>


Column :

${column}


<br><br>


<b>Total Panel :

${qty} pcs</b>


`;



}


</script>



</body>

</html>
